name: Publicar no GitHub Pages

# O site é o próprio repositório: index.html na raiz, app/ e dados/ ao lado.
# Não há build — este workflow só empacota os arquivos e publica.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se duas entrarem na fila, a mais nova vence.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Catalogo com typo (regime inexistente, chave_premissa quebrada) nao chega
      # ao ar: numero errado na tela e pior que pagina fora do ar.
      - name: Validar dados
        run: python scripts/validar.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: publicacao
        uses: actions/deploy-pages@v4
